<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Smart Life — AI-powered personal productivity, habit tracking, finance, health lifestyle, and everyday life organization toolkit.">
  <meta name="theme-color" content="#0D9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Life">
  <title>Smart Life — Personal Life Toolkit</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- Desktop Sidebar / Mobile Drawer -->
    <aside class="sidebar" id="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-header">
        <a href="#dashboard" class="brand" data-route="dashboard">
          <img src="./assets/logo.svg" alt="Smart Life logo" class="brand-logo" width="38" height="38">
          <div class="brand-text">
            <span class="brand-name">Smart Life</span>
            <span class="brand-tagline">Personal Toolkit</span>
          </div>
        </a>
        <button class="icon-btn mobile-only" id="closeSidebarBtn" aria-label="Close navigation menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="workspace-pill" id="sidebarWorkspaceCard">
        <div class="workspace-dot"></div>
        <div class="workspace-info">
          <span class="workspace-label">Workspace</span>
          <strong class="workspace-name" id="sidebarWorkspaceName">My Personal Space</strong>
        </div>
        <button class="icon-btn-sm" data-action="edit-workspace" title="Switch or edit workspace" aria-label="Edit workspace">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-group">
          <span class="nav-group-title">Overview</span>
          <button class="nav-item active" data-route="dashboard">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></span>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-route="ai">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/></svg></span>
            <span>AI Assistant</span>
            <span class="nav-badge badge-violet">AI</span>
          </button>
        </div>

        <div class="nav-group">
          <span class="nav-group-title">Daily Life Tools</span>
          <button class="nav-item" data-route="planner">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg></span>
            <span>Daily Planner</span>
          </button>
          <button class="nav-item" data-route="habits">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></span>
            <span>Habit Tracker</span>
          </button>
          <button class="nav-item" data-route="goals">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span>
            <span>Goal Management</span>
          </button>
          <button class="nav-item" data-route="finance">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M16 14h2"/></svg></span>
            <span>Personal Finance</span>
          </button>
          <button class="nav-item" data-route="timer">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>
            <span>Time Management</span>
          </button>
          <button class="nav-item" data-route="health">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9-9.5C1.5 7.5 4.5 4 8 4c2 0 3.5 1 4 2.5C12.5 5 14 4 16 4c3.5 0 6.5 3.5 5 7.5-2 5-9 9.5-9 9.5z"/></svg></span>
            <span>Health &amp; Lifestyle</span>
          </button>
          <button class="nav-item" data-route="organizer">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
            <span>Personal Organizer</span>
          </button>
        </div>

        <div class="nav-group" id="sidebarFavoritesGroup">
          <span class="nav-group-title">Favorites</span>
          <div id="sidebarFavoritesList" class="sidebar-favorites-list"></div>
        </div>

        <div class="nav-group">
          <span class="nav-group-title">Account &amp; App</span>
          <button class="nav-item" data-route="premium">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 17l-6.5 4 2-7.5L2 9h7l3-7z"/></svg></span>
            <span>Smart Life Premium</span>
            <span class="nav-badge badge-teal" id="sidebarPlanBadge">Free</span>
          </button>
          <button class="nav-item" data-route="settings">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg></span>
            <span>Settings &amp; Profile</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="promo-mini-card" id="sidebarPromoCard">
          <div class="promo-mini-title">Smart Life Premium</div>
          <p class="promo-mini-desc">Unlock all advanced planners &amp; AI workflows for ₹399/mo.</p>
          <button class="btn btn-gradient btn-sm btn-block" data-route="premium">View Plan</button>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- Main Content Column -->
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="openSidebarBtn" aria-label="Open navigation menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="topbar-title-wrap">
            <h1 class="topbar-title" id="topbarTitle">Dashboard</h1>
            <span class="topbar-subtitle" id="topbarDate">Today</span>
          </div>
        </div>

        <div class="topbar-search-wrap">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" id="globalSearchInput" placeholder="Search tasks, habits, goals, notes, tools..." aria-label="Search Smart Life">
            <kbd class="search-kbd">/</kbd>
          </div>
          <div class="search-dropdown hidden" id="globalSearchResults" role="listbox"></div>
        </div>

        <div class="topbar-actions">
          <span class="offline-pill hidden" id="offlinePill">Offline Mode</span>
          <button class="btn btn-primary btn-sm" id="quickAddBtn" title="Quick Add">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span class="hide-sm">Quick Add</span>
          </button>
          <button class="score-chip" data-route="dashboard" title="Today's Productivity Score" id="topbarScoreChip">
            <span class="score-chip-dot"></span>
            <span id="topbarScoreValue">0</span><span>%</span>
          </button>
          <button class="icon-btn hidden" id="installPwaBtn" title="Install Smart Life App" aria-label="Install Smart Life App">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
          </button>
          <button class="icon-btn notification-btn" id="alertsBellBtn" title="Reminders & Alerts" aria-label="Reminders and Alerts">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="alert-dot hidden" id="alertsBadge"></span>
          </button>
          <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Theme" aria-label="Toggle color theme">
            <svg id="themeIconSun" class="hidden" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg id="themeIconMoon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="avatar-btn" data-route="settings" id="topbarAvatarBtn" title="Profile & Settings" aria-label="Profile and Settings">
            <span id="topbarAvatarInitials">SL</span>
          </button>
        </div>
      </header>

      <main class="main-content" id="mainContent" tabindex="-1">
        <!-- Dynamic views rendered by script.js -->
      </main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Mobile Navigation">
    <button class="mobile-nav-item active" data-route="dashboard">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
      <span>Home</span>
    </button>
    <button class="mobile-nav-item" data-route="planner">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Planner</span>
    </button>
    <button class="mobile-nav-item" data-route="habits">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
      <span>Habits</span>
    </button>
    <button class="mobile-nav-item" data-route="ai">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/></svg>
      <span>AI</span>
    </button>
    <button class="mobile-nav-item" id="mobileMoreBtn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
      <span>Tools</span>
    </button>
  </nav>

  <!-- Modal Root -->
  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Modal</h2>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script defer src="./script.js"></script>
</body>
</html>
